server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The React route /assets collides with Vite's generated /assets directory.
    # Exact route matches must serve the SPA; files below /assets/ remain static.
    location = /assets { try_files "" /index.html; }
    location = /assets/ { try_files "" /index.html; }

    location / { try_files $uri $uri/ /index.html; }
}
