name: chaincontrol-node

services:
  keygen:
    image: hyperledger/besu:25.7.0
    profiles: [setup]
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        besu --data-path=/var/lib/besu public-key export --to=/config/node-public-key &&
        besu --data-path=/var/lib/besu public-key export-address --to=/config/node-address &&
        chmod 644 /config/node-public-key /config/node-address
    volumes:
      - node-data:/var/lib/besu
      - ./config:/config

  besu-validator-1:
    image: hyperledger/besu:25.7.0
    restart: unless-stopped
    environment:
      CHAIN_ID: ${CHAIN_ID}
      OVERLAY_IP: ${OVERLAY_IP}
      P2P_PORT: ${P2P_PORT:-30303}
      BOOTNODES: ${BOOTNODES}
      OBSERVER_PORT: ${OBSERVER_PORT:-5174}
    entrypoint: ["/bin/sh", "/scripts/besu-entrypoint.sh"]
    ports:
      - "${OVERLAY_IP}:${P2P_PORT:-30303}:${P2P_PORT:-30303}/tcp"
      - "${OVERLAY_IP}:${P2P_PORT:-30303}:${P2P_PORT:-30303}/udp"
      - "127.0.0.1:${RPC_PORT:-8545}:8545"
    volumes:
      - node-data:/var/lib/besu
      - ./config:/config
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8545'"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent:
    build: ./agent
    restart: unless-stopped
    depends_on:
      besu-validator-1:
        condition: service_healthy
    environment:
      CHAINCONTROL_API_URL: ${CHAINCONTROL_API_URL}
      NODE_UUID: ${NODE_UUID}
      NODE_NAME: ${NODE_NAME}
      NODE_VERSION: ${NODE_VERSION:-1.0.0}
      BESU_RPC_URL: http://besu-validator-1:8545
      CONFIG_DIR: /config
      NODE_CREDENTIAL_FILE: /run/secrets/node_credential
    volumes:
      - ./config:/config
      - ./.node/credential:/run/secrets/node_credential:ro

  observer-rpc-proxy:
    build: ./agent
    restart: unless-stopped
    entrypoint: ["python", "/agent/rpc_proxy.py"]
    depends_on:
      besu-validator-1:
        condition: service_healthy
    environment:
      BESU_RPC_URL: http://besu-validator-1:8545
      RPC_PROXY_PORT: 8080
      METADATA_API_URL: ${CHAINCONTROL_API_URL}

  observer:
    build:
      context: ./observer
      args:
        VITE_LOCAL_RPC_URL: /rpc/
    restart: unless-stopped
    depends_on:
      - observer-rpc-proxy
    ports:
      - "127.0.0.1:${OBSERVER_PORT:-5174}:80"
    volumes:
      - ./config/node-config.json:/usr/share/nginx/html/node-config.json:ro

volumes:
  node-data:
    name: chaincontrol-${NODE_UUID}-data
