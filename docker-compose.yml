name: chaincontrol

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  besu-bootstrap:
    image: hyperledger/besu:25.7.0
    user: root
    env_file: .env
    entrypoint: ["/bin/bash", "/network/bootstrap.sh"]
    volumes:
      - ./infrastructure/besu:/network
      - besu-config:/generated

  besu-validator-1: &besu-validator
    image: hyperledger/besu:25.7.0
    depends_on:
      besu-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/network/start-node.sh", "1"]
    volumes:
      - ./infrastructure/besu:/network:ro
      - besu-config:/generated
      - besu-1-data:/data
    networks:
      default:
        ipv4_address: 172.20.0.11
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8545'"]
      interval: 10s
      timeout: 5s
      retries: 20

  besu-validator-2:
    <<: *besu-validator
    entrypoint: ["/bin/bash", "/network/start-node.sh", "2"]
    volumes:
      - ./infrastructure/besu:/network:ro
      - besu-config:/generated
      - besu-2-data:/data
    networks:
      default:
        ipv4_address: 172.20.0.12
    ports: []

  besu-validator-3:
    <<: *besu-validator
    entrypoint: ["/bin/bash", "/network/start-node.sh", "3"]
    volumes:
      - ./infrastructure/besu:/network:ro
      - besu-config:/generated
      - besu-3-data:/data
    networks:
      default:
        ipv4_address: 172.20.0.13
    ports: []

  besu-validator-4:
    <<: *besu-validator
    entrypoint: ["/bin/bash", "/network/start-node.sh", "4"]
    volumes:
      - ./infrastructure/besu:/network:ro
      - besu-config:/generated
      - besu-4-data:/data
    networks:
      default:
        ipv4_address: 172.20.0.14
    ports: []

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      besu-validator-1:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - ./blockchain/deployments:/deployments:ro
      - ./backend/staticfiles:/app/staticfiles

  celery-worker:
    build: ./backend
    env_file: .env
    depends_on:
      - backend
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=1"]
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    env_file: .env
    depends_on:
      - backend
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
    volumes:
      - ./backend:/app

  contract-deployer:
    image: node:24-alpine
    profiles: ["tools"]
    working_dir: /contracts
    env_file: .env
    depends_on:
      besu-validator-1:
        condition: service_healthy
    command: ["sh", "-c", "npm ci && npm run compile && npm run deploy"]
    volumes:
      - ./blockchain:/contracts
      - blockchain-node-modules:/contracts/node_modules

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend

  observer:
    build: ./observer
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "5174:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/staticfiles:/usr/share/nginx/html/static:ro

volumes:
  mysql-data:
  redis-data:
  minio-data:
  besu-config:
  besu-1-data:
  besu-2-data:
  besu-3-data:
  besu-4-data:
  blockchain-node-modules:
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
